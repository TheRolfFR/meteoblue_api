[package]
name = "meteoblue_api"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[dependencies]
reqwest = { version = "0.13.3", features = ["blocking", "cookies"] }
scraper = "0.27.0"
serde = "1.0.219"
serde_derive = "1.0.219"
serde_json = "1.0.140"
clap = { version = "4.5.46", features = ["derive"] }
# graph dependencies
playwright = { version = "0.0.20", optional = true }
tokio = { version = "1.47.1", features = ["full"], optional = true }
# api dependencies
rouille = { version = "3.6.2", optional = true }
tempfile = { version = "3", optional = true }
log = "0.4.28"
env_logger = "0.11.8"
thirtyfour = "0.37.0"
async-trait = "0.1.89"
image = "0.25.10"

[build-dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[features]
default = ["graph", "api"]
graph = ["dep:playwright", "dep:tokio"]
api = ["dep:rouille", "dep:tempfile", "graph"]

[[bin]]
name = "meteoblue_bin"
path = "src/bin/main.rs"

# Define the second binary with a feature
[[bin]]
name = "meteoblue_graph"
path = "src/bin/graph.rs"
required-features = ["graph"]

# Define the third binary with another feature
[[bin]]
name = "meteoblue_api"
path = "src/bin/api.rs"
required-features = ["api"]
